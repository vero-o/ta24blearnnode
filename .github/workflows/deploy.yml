# Ehitab Vue projekti ja avaldab selle GitHub Pages'is.
# Leht: https://vero-o.github.io/ta24blearnnode/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build
        # base peab olema repo nimi, sest Pages serveerib alamkaustast
        env:
          VITE_BASE: /ta24blearnnode/
        run: npx vite build
      - name: SPA fallback
        # vue-router kasutab history-režiimi; ilma 404.html-ita annaks
        # otselink /clipboard peale GitHub Pages'is 404.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
